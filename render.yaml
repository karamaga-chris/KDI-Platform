databases:
  - name: kdi-db
    plan: free
    databaseName: kdi
    user: kdi

services:
  - type: web
    name: kdi-server
    env: node
    plan: free
    rootDir: server
    healthCheckPath: /api/health
    buildCommand: npm install && npm run prisma:generate && npm run build
    startCommand: npm run prisma:deploy && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: kdi-db
          property: connectionString
      - key: ALLOWED_ORIGIN
        sync: false
      - key: API_TOKEN
        sync: false
      - key: UPTIMEROBOT_API_KEY
        sync: false
      - key: MONITOR_REAL_HTTP
        value: "1"
      - key: USD_TO_RWF
        value: "1300"
